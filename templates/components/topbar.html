<header class="topbar panel glass">
    <div class="brand">
        <svg class="logo" viewBox="0 0 545 380" role="img" aria-label="WirelessPy">
            <use href="#logo-w"></use>
        </svg>
        <div class="brand-name">ireless<span class="python-extension">Py</span></div>
    </div>

    <div class="topbar-center connected">● Connected</div>
    <div class="topbar-right">
        <button class="refresh btn-style">Refresh</button>
        <button class="btn-user" id="profileBtn">
            <svg width="18" height="18">
                <use href="#icon-user"></use>
            </svg>
            <span id="usernameDisplay"></span>
            <svg width="14" height="14">
                <use href="#icon-chevron"></use>
            </svg>
        </button>

        <!-- Menu -->
        <div class="profile-menu" id="profileMenu" hidden>
            <div class="menu-header">
                <span>Signed in as</span>
                <strong id="userNameMenu">User</strong>
            </div>
            <div class="menu-divider"></div>

            <!-- Settings -->
            <button type="button" class="menu-item settings">
                <svg width="16" height="16" aria-hidden="true">
                    <use href="#icon-settings"></use>
                </svg>
                Settings
            </button>

            <!-- Logout -->
            <button type="button" class="menu-item text-danger" id="logout-btn">
                <svg width="16" height="16" aria-hidden="true">
                    <use href="#icon-logout"></use>
                </svg>
                Logout
            </button>
        </div>
    </div>
</header>
