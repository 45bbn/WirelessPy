<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WirelessPy - Login</title>
    <link rel="icon" type="image/svg+xml" href="/static/assets/icon/logo/favicon.svg">
    <link rel="stylesheet" href="/static/css/pages/login.css">
</head>

<body>
    {% include 'icons.html' %}

    <div class="bg-glow"></div>
    <canvas id="geo" aria-hidden="true"></canvas>
    <div class="spot" aria-hidden="true"></div>

    <div class="app">
        <header class="bar top">
            <div class="brand">
                <svg class="logo" viewBox="0 0 545 380" role="img" aria-label="WirelessPy">
                    <use href="#logo-w"></use>
                </svg>
                <div class="brand-name">ireless<span class="python-extension">Py</span></div>
            </div>

            <nav>
                <a href="https://github.com/45bbn/WirelessPy">GitHub</a>
                <a href="#">Docs</a>
            </nav>
        </header>


        
        <main class="stage">
            <section class="hero">
                <h1><span>Connect &bull;</span> <span>Control &bull;</span> <span>Automate</span></h1>
                <p>A unified platform for device control and automation.</p>
            </section>

            <form class="card" id="login-form" novalidate>
                <h2>Welcome back :D</h2>
                <p class="sub">Login to your WirelessPy account.</p>

                <label for="username">Username</label>
                <div class="field">
                    <!-- Panggil ikon user -->
                    <svg class="field-icon" width="24" height="24">
                        <use href="#icon-user"></use>
                    </svg>
                    <input id="username" name="username" type="text" autocomplete="username" required>
                </div>

                <label for="password">Password</label>
                <div class="field">
                    <!-- Panggil ikon lock -->
                    <svg class="field-icon" width="24" height="24">
                        <use href="#icon-lock"></use>
                    </svg>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                    <button class="toggle-pass" id="toggle-pass" type="button" aria-label="Show password"
                        aria-pressed="false">
                        <!-- Panggil ikon mata buka -->
                        <svg class="eye-show" width="24" height="24" aria-hidden="true">
                            <use href="#icon-eye"></use>
                        </svg>
                        <!-- Panggil ikon mata tutup -->
                        <svg class="eye-close" width="24" height="24" aria-hidden="true" hidden>
                            <use href="#icon-eye-off"></use>
                        </svg>
                    </button>
                </div>

                <p class="error" id="error" role="alert" aria-live="polite"></p>

                <button class="btn" id="submit" type="submit">
                    <span class="btn-label">Login</span>
                    <!-- Panggil ikon panah -->
                    <svg class="btn-arrow" width="24" height="24" aria-hidden="true">
                        <use href="#icon-arrow-right"></use>
                    </svg>
                </button>
            </form>
        </main>

        <footer class="bar bottom">
            <div class="status"><span class="dot"></span><span>Ready</span><span>v2.0.0</span></div>
            <div class="fx" role="group" aria-label="Visual effects">
                <span>Effects</span>
                <button type="button" data-mode="full" aria-pressed="false">Full</button>
                <button type="button" data-mode="saver" aria-pressed="false">Saver</button>
                <button type="button" data-mode="off" aria-pressed="false">Off</button>
            </div>
        </footer>
    </div>

    <script type="module" src="/static/js/login.js"></script>
    <script type="module" src="/static/js/wallpaper.js"></script>
</body>

</html>
